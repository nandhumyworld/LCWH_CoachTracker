# ===========================================================================
# LCWH — Coolify deployment manifest.
#
# Deploy on Coolify as a "Docker Compose" resource pointing at this repo.
# Coolify builds the Dockerfile, fronts the app with its Traefik proxy
# (TLS + routing), and injects the environment variables you set in its UI.
#
# What you do in the Coolify UI:
#   1. Set the Domain for the `app` service (Coolify terminates TLS and routes
#      it to the container's exposed port 3000 — do NOT publish host ports).
#   2. Set the environment variables below (the `${VAR:?...}` ones are required;
#      the deploy fails fast if they are missing).
#   3. Keep the `lcwh_uploads` volume as a persistent volume so uploaded images
#      survive redeploys.
#
# Database: EXTERNAL. Point DATABASE_URL at the managed Postgres (the existing
# LCWH_test DB on the VPS, or a Postgres you create in Coolify). This compose
# does NOT run its own Postgres.
#
# Migrations: the image entrypoint runs `prisma migrate deploy` on every boot,
# so pending migrations are applied automatically when the container starts.
# ===========================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify's proxy routes the assigned domain to this internal port.
    # Intentionally NOT `ports:` — no host publishing on the shared VPS.
    expose:
      - "3000"
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

      # --- Required (set in Coolify UI; deploy fails if unset) --------------
      # Use the INTERNAL hostname of the Postgres service.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Coolify}
      # Generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in Coolify}
      # Public HTTPS URL of the app, e.g. https://app.yourdomain.com
      AUTH_URL: ${AUTH_URL:?set AUTH_URL to the public https domain}
      # Bearer secret n8n/cron must send to /api/cron/* endpoints.
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in Coolify}

      # --- Optional (safe defaults; override in Coolify UI) -----------------
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}

      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/uploads}
      PHOTO_RETENTION_DAYS: ${PHOTO_RETENTION_DAYS:-90}

      # Seed accounts for `prisma db seed` (only used if you seed the DB).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@lcwh.co.in}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_COACH_EMAIL: ${SEED_COACH_EMAIL:-flary@lcwh.co.in}
      SEED_COACH_PASSWORD: ${SEED_COACH_PASSWORD:-coach123}

      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Life Changing Wellness Hub}
      NEXT_PUBLIC_APP_SHORT_NAME: ${NEXT_PUBLIC_APP_SHORT_NAME:-LCWH}
    volumes:
      # Persistent uploads (local-disk StorageService writes to /data/uploads).
      - lcwh_uploads:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  lcwh_uploads:
